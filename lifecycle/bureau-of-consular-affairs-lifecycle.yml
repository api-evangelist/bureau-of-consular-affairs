versioning:
  scheme: uri-path
  current: '3'
  surface: CKAN Action API
  detail: >-
    The CA Data Catalog runs CKAN and pins the API generation in the path — /api/3/action/{action}.
    The bureau publishes no versioning policy of its own; the "3" is CKAN's Action API generation and
    has been stable across CKAN 2.x. The ArcGIS Feature Services report currentVersion 12 (ArcGIS
    Online 12.0.0), which is Esri's platform version, not a bureau-declared API version.
  docs: null
deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    No deprecation policy, Sunset header (RFC 8594) or Deprecation header is published for any
    surface. Data-level retirement happens by dataset: yearly adoption-statistics Feature Services
    are added rather than superseded, and older Travel Advisory map services (Travel_Advisories_7_30,
    Travel_Advisories_CubaUpdate0823, TravelAdvisories_haitiUpdate) remain published alongside the
    current "(2024)" view layer with no notice marking the earlier ones stale.
