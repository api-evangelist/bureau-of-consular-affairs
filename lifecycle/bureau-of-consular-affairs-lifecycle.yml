status_page_detail: >-
  No status page found. status.state.gov does not resolve; travel.state.gov/status returns the
  Cloudflare 403 interstitial served to this crawler for every travel.state.gov page path.
change_feed:
  detail: >-
    The closest thing to a published change log is the Travel Advisories RSS feed, which is dated
    per item and carries an explicit "what changed" sentence in each description (e.g. "There were
    no changes to the advisory level or risk indicators. Advisory summary was updated."). It is a
    content feed, not an API change log — it tells you when an ADVISORY changed, never when the
    INTERFACE changed.
