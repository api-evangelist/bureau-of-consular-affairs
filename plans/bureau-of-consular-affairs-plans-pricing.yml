description: >-
  The Bureau of Consular Affairs charges nothing for any API surface and publishes no plans, tiers or
  pricing page. Every surface found in this profile — the CKAN Action API on the CA Data Catalog, the
  five public ArcGIS Feature Services, and the travel advisory RSS feeds — is free, anonymous and
  open. The harvested spec declares the licence as "U.S. Government Work"
  (https://www.usa.gov/government-works), which is public domain. There is no signup, no key issuance
  for read access, and no commercial tier to record.
note: >-
  This file previously carried a three-tier Free / Professional / Enterprise scaffold written by the
  2026-05-04 bulk sweep, with invented quotas (1,000 and 100,000 requests per month), invented rate
  limits and "TBD" prices. None of it was ever published by the bureau, and asserting a paid
  Enterprise tier for a U.S. federal open-data catalog is not a defensible claim to make on a
  government agency's behalf. Replaced 2026-09-05 with the searched result: there are no plans.
  plan_count 0 is the finding, not a gap.
