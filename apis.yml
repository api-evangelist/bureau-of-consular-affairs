description: >-
  The Bureau of Consular Affairs (CA) is a bureau of the United States
  Department of State responsible for administering laws, formulating regulations,
  and implementing policies related to consular services and immigration.
  CA provides travel advisories, passport and visa information, and publishes
  datasets through its data catalog accessible via the CKAN API.
apis:
- aid: bureau-of-consular-affairs:ca-data-catalog-ckan-api
  name: Bureau of Consular Affairs Data Catalog (CKAN API)
  tags:
  - CKAN
  - Data Catalog
  - Federal-Government
  - Open Data
  tags_raw:
  - CKAN
  - Data Catalog
  - Federal Government
  - Open Data
  humanURL: https://cadatacatalog.state.gov/
  baseURL: https://cadatacatalog.state.gov/api/3/action
  properties:
  - url: https://cadatacatalog.state.gov/dataset/
    type: Documentation
  - url: https://cadatacatalog.state.gov/api/3
    type: DataAPI
  description: >-
    The CA Data Catalog provides access to datasets from the Bureau of Consular Affairs via the CKAN API.
    It includes passport issuance statistics, visa issuance data, adoption statistics, and other consular
    affairs data. The CKAN API supports dataset search, retrieval, and resource downloads.
- aid: bureau-of-consular-affairs:travel-advisories
  name: Travel Advisories API
  tags:
  - Federal-Government
  - Travel
  - Travel Advisories
  tags_raw:
  - Federal Government
  - Travel
  - Travel Advisories
  humanURL: https://travel.state.gov/content/travel/en/traveladvisories/traveladvisories.html/
  baseURL: https://services6.arcgis.com/R6wlO6UHmSzqm9Vs/arcgis/rest/services/Travel_Advisory_Levels__(2024)_View_Layer/FeatureServer
  properties:
  - url: https://travel.state.gov/content/travel/en/traveladvisories/traveladvisories.html/
    type: Documentation
  - url: openapi/bureau-of-consular-affairs-arcgis-travel-advisory-levels-layer.json
    type: ArcGIS
  - url: openapi/bureau-of-consular-affairs-arcgis-travel-advisory-levels-featureserver.json
    type: ArcGIS
  - url: https://travel.state.gov/_res/rss/TAsTWs.xml
    type: RSS
  - url: https://travelmaps.state.gov/TSGMap/
    type: Application
  - url: skills/bureau-of-consular-affairs-check-travel-advisory.md
    type: AgentSkill
  description: >-
    The State Department publishes travel advisory levels (Level 1-4) for every country. The
    machine-readable surface is an ArcGIS Online Feature Service on the bureau's own Esri tenant
    (R6wlO6UHmSzqm9Vs): one polygon per country carrying LEVEL_ (1-4), the ISO 3166-1 alpha-3 code,
    the advisory date and the URL of the human advisory page. Anonymous, no key, capabilities Query,
    maxRecordCount 2000. A dated RSS feed of the same advisories is published at
    travel.state.gov/_res/rss/TAsTWs.xml (216 items observed 2026-09-05) and is the only change
    signal the bureau offers. baseURL was https://travel.state.gov, the website root, which named no
    API host; corrected 2026-09-05 to the Feature Service that actually answers.
