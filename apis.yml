- aid: bureau-of-consular-affairs:embassy-and-consulate-locations
  name: Embassy and Consulate Locations
  tags:
  - Federal-Government
  - Consular Services
  - Embassies
  - Geospatial
  tags_raw:
  - Federal Government
  - Consular Services
  - Embassies
  - Geospatial
  humanURL: https://www.state.gov/bureaus-offices/under-secretary-for-management/bureau-of-consular-affairs/
  baseURL: https://services6.arcgis.com/R6wlO6UHmSzqm9Vs/arcgis/rest/services/Embassy_and_Consulate_Locations_View_Layer/FeatureServer
  properties:
  - url: openapi/bureau-of-consular-affairs-arcgis-embassy-consulate-locations-layer.json
    type: ArcGIS
  - url: openapi/bureau-of-consular-affairs-arcgis-embassy-consulate-locations-featureserver.json
    type: ArcGIS
  - url: skills/bureau-of-consular-affairs-find-embassy.md
    type: AgentSkill
  description: >-
    Public ArcGIS Feature Service listing every U.S. embassy, consulate general, consular agency and
    virtual presence post, with address, telephone, after-hours emergency telephone, email, website
    and a prebuilt directions link. Carries ConSvcProv, which names the post that actually provides
    consular services for a location — not necessarily the nearest one. Country is keyed on GENC3
    (the U.S. Government GENC code), not ISO 3166-1, so joining posts to travel advisories needs a
    crosswalk the bureau does not publish. Anonymous, no key.
- aid: bureau-of-consular-affairs:intercountry-adoption-statistics
  name: Intercountry Adoption Statistics
  tags:
  - Federal-Government
  - Adoption
  - Statistics
  tags_raw:
  - Federal Government
  - Adoption
  - Statistics
  humanURL: https://www.state.gov/bureaus-offices/under-secretary-for-management/bureau-of-consular-affairs/
  baseURL: https://services6.arcgis.com/R6wlO6UHmSzqm9Vs/arcgis/rest/services/All_Years_Adoption_Statistics/FeatureServer
  properties:
  - url: openapi/bureau-of-consular-affairs-arcgis-intercountry-adoption-statistics-featureserver.json
    type: ArcGIS
  description: >-
    Intercountry and U.S. adoption counts published as ArcGIS Feature Services. The bureau publishes
    roughly fifty of these — one per year from 1999 through 2022, for both intercountry adoptions and
    U.S. adoptions, alongside All-Years rollups. The year is encoded in the SERVICE NAME rather than
    in a field, so building a time series means enumerating services rather than filtering one.
